# /etc/nginx/sites-available/internship-tracker
#
# PHA 2 — HTTPS (dùng từ 20/11). YÊU CẦU: cert đã tồn tại.
#   Chưa có cert  → dùng internship-tracker.http.conf
#   Có cert rồi   → file này.
#
# Trước khi reload:
#   sudo cp infra/nginx/snippets/*.conf /etc/nginx/snippets/
#   sudo sed -i 's/staging\.example\.com/<host>/g' /etc/nginx/sites-available/internship-tracker
#   sudo nginx -t && sudo systemctl reload nginx
#
# /health có 2 mức:
#   - tĩnh  : dùng khi API chưa sẵn sàng (vẫn đủ acceptance TLS/SSL Labs)
#   - proxy : dùng khi Node chạy dưới systemd (19/11 hoặc 23/11 với API thật)

server {
    listen      80;
    listen [::]:80;
    server_name internship-tracker.duckdns.org;   # đổi đúng 1 chỗ này khi đổi host

    server_tokens off;

    # HTTP không phục vụ gì: chỉ tồn tại để đẩy lên HTTPS.
    return 301 https://$host$request_uri;
}

server {
    # Ubuntu 24.04 có nginx 1.24 → phải dùng "listen ... http2".
    # "http2 on;" chỉ có từ nginx 1.25.1+, khai vào là nginx -t fail.
    listen      443 ssl http2;
    listen [::]:443 ssl http2;
    server_name internship-tracker.duckdns.org;   # đổi đúng 1 chỗ này khi đổi host

    server_tokens off;

    # Cert do: sudo certbot certonly --nginx -d <host>
    # Đường dẫn dưới đây do sed đổi theo host; nếu dùng DuckDNS thì là
    # /etc/letsencrypt/live/<ten>.duckdns.org/...
    ssl_certificate     /etc/letsencrypt/live/internship-tracker.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/internship-tracker.duckdns.org/privkey.pem;

    include /etc/nginx/snippets/tls.conf;        # TLS 1.2/1.3, cipher, session
    include /etc/nginx/snippets/security.conf;   # HSTS + 4 security headers

    access_log /var/log/nginx/internship-tracker.access.log;
    error_log  /var/log/nginx/internship-tracker.error.log warn;

    # ---------- /health BẢN TĨNH (dùng khi chưa có API) ----------
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"internship-tracker","phase":"static"}';
    }

    # ---------- /health QUA NODE (bỏ comment khi API đã chạy) ----------
    # Bỏ comment block dưới và comment block tĩnh ở trên.
    #
    # location = /health {
    #     proxy_pass http://127.0.0.1:3000/health;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_connect_timeout 5s;
    #     proxy_read_timeout    10s;
    # }

    # Không lộ route khác trong trial.
    location / {
        return 404;
    }
}