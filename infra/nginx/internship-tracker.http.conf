# /etc/nginx/sites-available/internship-tracker
#
# PHA 1 — CHỈ HTTP (18–19/11). Dùng file này khi CHƯA có cert.
# Lý do tồn tại: block HTTPS không thể nạp nếu chưa có ssl_certificate
#               → nginx -t fail → mất luôn cả HTTP.
#
# Cách dùng:
#   sudo cp infra/nginx/internship-tracker.http.conf /etc/nginx/sites-available/internship-tracker
#   sudo ln -sf /etc/nginx/sites-available/internship-tracker /etc/nginx/sites-enabled/internship-tracker
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Khi đã có cert (20/11) → thay bằng internship-tracker.conf.

server {
    listen      80;
    listen [::]:80;
    server_name internship-tracker.duckdns.org;   # đổi host ở đây (bản HTTPS có 3 chỗ khác: 2 server_name + 2 cert path)

    server_tokens off;

    # Site tĩnh: chỉ 4 file (index.html, styles.css, app.js, favicon.svg).
    # Deploy từ máy dev:  scp index.html styles.css app.js favicon.svg staging:/var/www/internship-tracker/
    root  /var/www/internship-tracker;
    index index.html;

    access_log /var/log/nginx/internship-tracker.access.log;
    error_log  /var/log/nginx/internship-tracker.error.log warn;

    # /health trả JSON tĩnh: chứng minh DNS + Nginx + port 80 trước khi có TLS.
    location = /health {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"status":"ok","service":"internship-tracker","phase":"static-http"}';
    }

    # /            → index.html (200)
    # /styles.css  → file thật (200)
    # /khong-co    → 404
    location / {
        # Rate limit (day 23): 2r/s, burst 5. /health is a separate location
        # so the uptime monitor is NOT rate-limited.
        limit_req zone=it_limit burst=5 nodelay;
        limit_req_status 429;   # 429 = Too Many Requests (503 = server error — sai ý nghĩa)

        try_files $uri $uri/ =404;
    }

    # Không phục vụ file ẩn (.git, .env nếu ai đó copy nhầm vào web root).
    location ~ /\. {
        deny all;
    }
}
