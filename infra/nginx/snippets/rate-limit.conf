# Rate limit — HTTP context (copy to /etc/nginx/conf.d/rate-limit.conf)
#
# nginx.conf on Ubuntu includes /etc/nginx/conf.d/*.conf inside the http block.
# limit_req_zone must live in http context — cannot be in sites-available.
#
# 10 MB ~ 160,000 IPs (one state per client IP).
# rate=2r/s, burst=5, nodelay: cho phep 5 request dau di ngay, sau do gioi han 2/s.
# Tra 429 (Too Many Requests) thay vi 503 (server error) de phan biet dung nguyen nhan.

limit_req_zone $binary_remote_addr zone=it_limit:10m rate=2r/s;
