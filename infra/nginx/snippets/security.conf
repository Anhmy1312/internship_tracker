# /etc/nginx/snippets/security.conf
#
# Lý do tồn tại file này: trong Nginx, nếu MỘT location có add_header thì toàn bộ
# add_header kế thừa từ server bị bỏ. Gom vào 1 snippet rồi include ở mọi nơi
# cần, tránh việc thêm header cho /health mà mất header ở trang 404.
#
# `always` = header có cả trên response lỗi (4xx/5xx), cần cho SSL Labs.

add_header X-Content-Type-Options   "nosniff" always;
add_header X-Frame-Options          "DENY" always;
add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;

# HSTS: bật max-age trước. CHỈ thêm "; includeSubDomains" (và preload) sau khi
# đã kiểm soát toàn bộ subdomain — thêm sớm là tự khoá mình.
add_header Strict-Transport-Security "max-age=31536000" always;
