# /etc/nginx/sites-available/internship-tracker
#
# BẢN API — dùng SAU khi deploy Node/systemd (22/11 theo kế hoạch mới).
# Thay thế hoàn toàn file tĩnh `internship-tracker.conf` bằng file này.
# Giữ nguyên TLS/HSTS/rate limit; CHỈ đổi /health từ JSON tĩnh sang proxy
# và thêm /applications.
#
# Trước khi reload:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Kiểm tra sau reload (chạy infra/scripts/preflight-api.sh trên VM).

server {
    listen      80;
    listen [::]:80;
    server_name internship-tracker.duckdns.org;   # đổi host ở 4 chỗ: 2 server_name + 2 đường dẫn cert

    server_tokens off;

    # HTTP không phục vụ gì: chỉ đẩy lên HTTPS.
    return 301 https://$host$request_uri;
}

server {
    # Ubuntu 24.04 có nginx 1.24 → dùng "listen ... http2".
    listen      443 ssl http2;
    listen [::]:443 ssl http2;
    server_name internship-tracker.duckdns.org;   # đổi host ở 4 chỗ: 2 server_name + 2 đường dẫn cert

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/internship-tracker.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/internship-tracker.duckdns.org/privkey.pem;

    include /etc/nginx/snippets/tls.conf;        # TLS 1.2/1.3, cipher, session
    include /etc/nginx/snippets/security.conf;   # HSTS + 4 security headers

    access_log /var/log/nginx/internship-tracker.access.log;
    error_log  /var/log/nginx/internship-tracker.error.log warn;

    # Vẫn phục vụ 4 file tĩnh của client từ web root.
    root  /var/www/internship-tracker;
    index index.html;

    # ---------- /health → API (KHÔNG rate-limit để UptimeRobot không bị 429) ----------
    # KHÔNG dùng add_header trong location này — nó sẽ ghi đè HSTS/security header
    # của server block. Chỉ set proxy header.
    location = /health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- /applications → API (có rate limit chống spam) ----------
    # prefix location: /applications và /applications/:id đều khớp.
    location /applications {
        limit_req zone=it_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000/applications;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- static ----------
    location / {
        limit_req zone=it_limit burst=5 nodelay;
        limit_req_status 429;

        try_files $uri $uri/ =404;
    }

    # Không phục vụ file ẩn (.git, .env nếu copy nhầm vào web root).
    location ~ /\. {
        deny all;
    }
}
